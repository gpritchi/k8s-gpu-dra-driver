apiVersion: v1
kind: Namespace
metadata:
  name: gpu-test

---
## [Alpha] Two workloads share one whole GPU by booking part of its memory.
## Requires featureGates.WholeGPUSharing=true in Helm values and Kubernetes
## 1.36+ (DRAConsumableCapacity). Both claims below can land on the same GPU
## as long as their memory requests fit in its VRAM; a third claim that asks
## for more than what is left stays Pending.
## Booking is scheduler accounting only: nothing stops a container from using
## more VRAM than it requested. See docs/driver-attributes.md.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: gpu-test
  name: gpu-share-4gi
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.amd.com
          capacity:
            requests:
              memory: 4Gi

---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: gpu-test
  name: gpu-share-8gi
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.amd.com
          capacity:
            requests:
              memory: 8Gi

---
apiVersion: v1
kind: Pod
metadata:
  namespace: gpu-test
  name: share-4gi-pod
  labels:
    app: whole-gpu-sharing-test
spec:
  containers:
  - name: gpu-workload
    image: docker.io/rocm/pytorch:latest
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: gpu-share-4gi

---
apiVersion: v1
kind: Pod
metadata:
  namespace: gpu-test
  name: share-8gi-pod
  labels:
    app: whole-gpu-sharing-test
spec:
  containers:
  - name: gpu-workload
    image: docker.io/rocm/pytorch:latest
    command: ["bash", "-c"]
    args: ["export; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: gpu-share-8gi
